<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .auth { margin: 26px 0; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #16253a; }
    .auth[data-state="in"] { border-color: #4fb39a; }
    .status { margin: 0 0 14px; font-size: 16px; color: #ecf4ff; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #51667c; background: #0c1522; color: #ecf4ff; }
    button { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 10px; border: 0; background: #8ad8df; color: #0c1522; cursor: pointer; justify-self: start; }
    button:disabled { opacity: .6; cursor: progress; }
    .error { margin: 10px 0 0; color: #ffb4c0; font-size: 15px; }
    .error:empty { display: none; }
    [hidden] { display: none !important; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #51667c; background: #0c1522; color: #ecf4ff; min-height: 70px; resize: vertical; }
    .editor { margin: 26px 0 12px; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #16253a; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .ghost { background: transparent; color: #8ad8df; border: 1px solid #51667c; }
    .danger { background: #d07384; color: #1a0d12; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인을 붙입니다</div>
    <h1>내 자료실</h1>
    <p>메모는 서버 함수가 학습용 DB에서 읽어 옵니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>

    <section class="auth" id="auth" data-state="loading" aria-live="polite">
      <h2>로그인</h2>
      <p class="status" id="auth-status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p class="error" id="auth-error" role="alert"></p>
    </section>

    <div class="notice">서버 함수가 로그인 토큰을 직접 확인하고, 로그인하지 않은 요청은 자료 없이 거부합니다. 다만 아직 메모 한 건을 읽고 고치고 지울 때 주인을 확인하지 않아, 다른 계정도 id만 알면 바꿀 수 있습니다. 이 허점은 다음 단계에서 막습니다.</div>

    <section class="editor" id="editor" hidden>
      <h2>새 메모 추가</h2>
      <form id="note-form">
        <label>제목 <input id="note-title" maxlength="120" required></label>
        <label>내용 <textarea id="note-body" maxlength="2000"></textarea></label>
        <button id="note-add" type="submit">추가</button>
      </form>
      <p class="error" id="note-error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 공식 Supabase JS SDK. 버전을 고정해 받습니다.
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    // 공개용 값만 둡니다. 서버 전용 키(sb_secret_…)는 절대 이 파일에 넣지 않습니다.
    const SUPABASE_URL = 'https://yakpkxozjfwnflpizavj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_V5VlfcGTbZMcpuwAZlaKyA_vWw6O-lr';

    const box = document.querySelector('#auth');
    const statusText = document.querySelector('#auth-status');
    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const errorText = document.querySelector('#auth-error');
    const list = document.querySelector('#notes');
    let loadSeq = 0;
    const editor = document.querySelector('#editor');
    const noteForm = document.querySelector('#note-form');
    const noteError = document.querySelector('#note-error');

    function showError(message) { errorText.textContent = message; }

    function loginFailureReason(error) {
      const raw = error?.message ?? '';
      if (error?.code === 'invalid_credentials' || /invalid login credentials/i.test(raw)) {
        return '이메일 또는 비밀번호가 맞지 않습니다.';
      }
      if (error?.code === 'email_not_confirmed' || /email not confirmed/i.test(raw)) {
        return '이메일 인증이 끝나지 않은 계정입니다. Supabase에서 계정을 확인 처리해 주세요.';
      }
      if (error?.status === 429 || /rate limit/i.test(raw)) {
        return '시도가 너무 많습니다. 잠시 뒤 다시 시도해 주세요.';
      }
      if (error?.name === 'AuthRetryableFetchError' || /fetch/i.test(raw)) {
        return '로그인 서버에 연결하지 못했습니다. 네트워크를 확인해 주세요.';
      }
      return `로그인하지 못했습니다. (${raw || '알 수 없는 오류'})`;
    }

    function render(session) {
      const user = session?.user;
      box.dataset.state = user ? 'in' : 'out';
      statusText.textContent = user
        ? `${user.email} 계정으로 로그인했습니다.`
        : '로그인하지 않았습니다.';
      form.hidden = Boolean(user);
      logoutButton.hidden = !user;
      loadNotes(session);
    }

    let supabase = null;
    if (SUPABASE_PUBLISHABLE_KEY.startsWith('여기에')) {
      box.dataset.state = 'out';
      statusText.textContent = '로그인을 쓸 수 없습니다.';
      showError('index.html의 SUPABASE_PUBLISHABLE_KEY 자리에 publishable key를 넣어 주세요.');
      loadNotes(null);
    } else {
      supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      supabase.auth.onAuthStateChange((_event, session) => render(session));
      const { data } = await supabase.auth.getSession();
      render(data.session);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!supabase) return;
      showError('');
      loginButton.disabled = true;
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: document.querySelector('#email').value.trim(),
          password: document.querySelector('#password').value,
        });
        if (error) showError(loginFailureReason(error));
        else document.querySelector('#password').value = '';
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      if (!supabase) return;
      showError('');
      logoutButton.disabled = true;
      const { error } = await supabase.auth.signOut();
      logoutButton.disabled = false;
      if (error) showError(`로그아웃하지 못했습니다. (${error.message})`);
    });

    // 메모 API 도우미: 매번 현재 세션의 토큰을 Authorization 헤더로 보냅니다.
    // 토큰은 화면이나 콘솔에 출력하지 않습니다. 사용자 ID는 보내지 않습니다(서버가 토큰으로 확인).

    async function api(path, { method = 'GET', body } = {}) {
      const { data } = supabase ? await supabase.auth.getSession() : { data: {} };
      const token = data?.session?.access_token;
      if (!token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        method, cache: 'no-store',
        headers: { Authorization: `Bearer ${token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (response.status === 401) throw new Error('로그인이 만료되었거나 확인되지 않았습니다. 다시 로그인해 주세요.');
      if (response.status === 404) throw new Error('메모를 찾을 수 없습니다. 이미 지워졌을 수 있습니다.');
      if (response.status === 400) throw new Error('제목(120자 이내)과 내용(2000자 이내)을 확인해 주세요.');
      if (!response.ok) throw new Error('서버에서 요청을 처리하지 못했습니다.');
      return response.status === 204 ? null : response.json();
    }

    function showMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    function noteItem(note) {
      const item = document.createElement('li');
      const view = document.createElement('div');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      title.textContent = note.title;
      body.textContent = note.body;
      const actions = document.createElement('div');
      actions.className = 'row';
      const editBtn = Object.assign(document.createElement('button'), { type: 'button', textContent: '수정', className: 'ghost' });
      const delBtn = Object.assign(document.createElement('button'), { type: 'button', textContent: '삭제', className: 'danger' });
      actions.append(editBtn, delBtn);
      view.append(title, body, actions);

      const form = document.createElement('form');
      form.hidden = true;
      const tIn = Object.assign(document.createElement('input'), { value: note.title, maxLength: 120, required: true });
      const bIn = Object.assign(document.createElement('textarea'), { value: note.body, maxLength: 2000 });
      const formActions = document.createElement('div');
      formActions.className = 'row';
      const saveBtn = Object.assign(document.createElement('button'), { type: 'submit', textContent: '저장' });
      const cancelBtn = Object.assign(document.createElement('button'), { type: 'button', textContent: '취소', className: 'ghost' });
      formActions.append(saveBtn, cancelBtn);
      const tLabel = document.createElement('label'); tLabel.append('제목 ', tIn);
      const bLabel = document.createElement('label'); bLabel.append('내용 ', bIn);
      form.append(tLabel, bLabel, formActions);

      const err = Object.assign(document.createElement('p'), { className: 'error' });
      item.append(view, form, err);

      editBtn.addEventListener('click', () => { view.hidden = true; form.hidden = false; err.textContent = ''; });
      cancelBtn.addEventListener('click', () => { form.hidden = true; view.hidden = false; err.textContent = ''; });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        saveBtn.disabled = true; err.textContent = '';
        try {
          const saved = await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'PUT', body: { title: tIn.value, body: bIn.value } });
          item.replaceWith(noteItem(saved));
        } catch (error) { err.textContent = error.message; }
        finally { saveBtn.disabled = false; }
      });
      delBtn.addEventListener('click', async () => {
        delBtn.disabled = true; err.textContent = '';
        try {
          await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
          item.remove();
          if (!list.children.length) showMessage('아직 메모가 없습니다. 위에서 추가해 보세요.');
        } catch (error) { err.textContent = error.message; delBtn.disabled = false; }
      });
      return item;
    }

    async function loadNotes(session) {
      const seq = ++loadSeq;
      editor.hidden = !session?.access_token;
      noteError.textContent = '';
      if (!session?.access_token) {
        showMessage('로그인하면 메모가 보입니다.');
        return;
      }
      showMessage('가상 자료를 불러오는 중입니다.');
      try {
        const notes = await api('/api/notes');
        if (seq !== loadSeq) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) showMessage('아직 메모가 없습니다. 위에서 추가해 보세요.');
        else list.replaceChildren(...notes.map(noteItem));
      } catch (error) {
        if (seq === loadSeq) showMessage(error.message);
      }
    }

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const addBtn = document.querySelector('#note-add');
      const title = document.querySelector('#note-title');
      const body = document.querySelector('#note-body');
      addBtn.disabled = true; noteError.textContent = '';
      try {
        const { id } = await api('/api/notes', { method: 'POST', body: { title: title.value, body: body.value } });
        const saved = await api(`/api/notes/${encodeURIComponent(id)}`);
        if (list.firstElementChild && !list.querySelector('strong')) list.replaceChildren();
        list.append(noteItem(saved));
        title.value = ''; body.value = '';
      } catch (error) { noteError.textContent = error.message; }
      finally { addBtn.disabled = false; }
    });
  </script>
</body>
</html>
