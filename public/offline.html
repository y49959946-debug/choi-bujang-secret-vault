<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK | 연결 끊김</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 22px; }
    h1 { font-size: clamp(26px, 6vw, 38px); margin: 0 0 16px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .box { margin-top: 22px; padding: 16px 18px; border: 1px solid #51667c; border-radius: 14px; background: #16253a; }
    button { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 10px; border: 0; background: #8ad8df; color: #0c1522; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 서버에 연결할 수 없습니다</h1>
    <p>내 자료실의 메모는 서버가 로그인과 기기 승인을 확인한 뒤에만 보여 줍니다. 그래서 이 앱은 메모를 기기에 저장해 두지 않고, 연결이 끊긴 동안에는 자료를 보여 주지 않습니다.</p>
    <div class="box">
      <p>앱으로 설치했다는 표시만으로는 기기 확인이 끝나지 않습니다. 연결되면 서버가 다시 확인합니다.</p>
    </div>
    <p><button type="button" onclick="location.reload()">다시 연결하기</button></p>
  </main>
</body>
</html>
